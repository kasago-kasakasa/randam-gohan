<style>
:root{
  /* 献立ガチャ：白磁のような青緑グレーの地に、抹茶の深緑と卵黄色。1カラムのカード列＋下部ドック */
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#1B2824; --muted:#5A6863; --line:#D5DDD8;
  --accent:#1E6A56; --accent-soft:#DAEAE3; --on-accent:#FFFFFF; --pop:#F1B33F; --pop-ink:#2B1F04;
  --c-s:#B5861A; --c-p:#9A5A34; --c-m:#BE4E38; --c-d:#4A8434; --c-j:#3A70A2;
  --ok:#2B8657; --warn:#B9730E; --bad:#BF3A32;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(15,40,30,.06),0 6px 18px rgba(15,40,30,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1A211E; --surface-2:#212A26; --ink:#E5ECE8; --muted:#9BAAA3; --line:#2E3934;
    --accent:#62C0A3; --accent-soft:#1F3A31; --on-accent:#0A1A14; --pop:#F2B850; --pop-ink:#231803;
    --c-s:#D9AE45; --c-p:#C98A62; --c-m:#E2735C; --c-d:#7DB862; --c-j:#6EA6D8;
    --ok:#5CC08A; --warn:#E3A145; --bad:#EC6E64; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A211E; --surface-2:#212A26; --ink:#E5ECE8; --muted:#9BAAA3; --line:#2E3934;
  --accent:#62C0A3; --accent-soft:#1F3A31; --on-accent:#0A1A14; --pop:#F2B850; --pop-ink:#231803;
  --c-s:#D9AE45; --c-p:#C98A62; --c-m:#E2735C; --c-d:#7DB862; --c-j:#6EA6D8;
  --ok:#5CC08A; --warn:#E3A145; --bad:#EC6E64; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,5.4vw,22px);margin:0;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
header.top h1 .dot{width:12px;height:12px;border-radius:50%;background:var(--pop);box-shadow:14px 0 0 var(--c-m),28px 0 0 var(--c-d);margin-right:28px;flex:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
main{padding-bottom:150px}
.view[hidden]{display:none}
/* segmented */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0 10px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px;font-size:14px}
.opt{display:flex;align-items:center;gap:6px}
.opt>span{color:var(--muted);font-size:13px}
.mini{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mini button{border:0;background:transparent;padding:5px 10px;font-size:14px;min-width:38px}
.mini button+button{border-left:1px solid var(--line)}
.mini button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.clear{color:var(--bad);border-style:dashed}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.pool{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.pool .warn{color:var(--warn)}
/* strip */
.strip{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;margin:4px 0 10px;font-size:13px;color:var(--muted)}
.strip b{font-family:var(--f-display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin:0 2px}
.strip .s{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 10px}
.strip .s.warn b{color:var(--warn)}
.strip .s.bad b{color:var(--bad)}
.strip .open-all{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px 0}
/* cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border-left:6px solid var(--rc);overflow:hidden}
.card.skip{opacity:.7;box-shadow:none;border:1px dashed var(--line);border-left:6px solid var(--rc)}
.card-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 4px 12px 14px;min-width:0}
.card-main:focus-visible{outline:2.5px solid var(--accent);outline-offset:-3px}
.role{font-size:12px;font-weight:700;color:var(--rc);letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.role .fav{color:var(--pop)}
.nm{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .more{color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:2px}
.meta .more svg{width:14px;height:14px;transition:transform .2s}
.card[data-open="1"] .meta .more svg{transform:rotate(180deg)}
.card-tools{display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px 4px;justify-content:center}
.ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.ic.on{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.card.rolling .nm{color:var(--muted)}
.card.rolling{animation:shake .12s linear infinite alternate}
@keyframes shake{from{transform:translateX(-1px)}to{transform:translateX(1px)}}
.card.landed{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
.detail{grid-column:1/-1;border-top:1px solid var(--line);padding:12px 14px 14px;background:var(--surface-2)}
/* detail content */
.nut{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;margin-bottom:12px}
.nut div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.nut b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.nut small{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px}
.dh h4{margin:0;font-size:14px}
.srv{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.srv button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.srv output{min-width:44px;text-align:center;font-weight:700}
.ings{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.ings li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:14px}
.ings li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:400px){.ings{grid-template-columns:1fr}}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px;padding:6px 0;font-size:14.5px}
.steps li::before{content:counter(s);display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12.5px;font-weight:700;margin-top:1px}
.dtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.fav-on{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.btn.danger{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
/* balance */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-top:12px}
.panel h3{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{font-weight:400;color:var(--muted);font-size:12px}
.meter{margin:8px 0}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px}
.meter .lbl b{font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pfc{display:flex;height:22px;border-radius:8px;overflow:hidden;margin-top:6px;font-size:11.5px;font-weight:700;color:#fff}
.pfc span{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden}
.pfc .p{background:var(--c-m)} .pfc .f{background:var(--c-s)} .pfc .c{background:var(--c-j)}
.pfcl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.pfcl b{color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.actions .btn{padding:10px 6px;font-size:13.5px}
/* week */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px}
.day header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day header b{font-family:var(--f-display);font-size:16px}
.day header .k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.day header .ic{width:34px;height:34px}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.day li button{all:unset;cursor:pointer;display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;width:100%;padding:5px 0;border-top:1px dotted var(--line);font-size:14.5px}
.day li:first-child button{border-top:0}
.day li button:focus-visible{outline:2px solid var(--accent)}
.day li .r{font-size:11.5px;font-weight:700;color:var(--rc)}
.day li .t{font-size:12px;color:var(--muted)}
/* list */
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin:8px 0}
.count{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;background:var(--surface);border-radius:12px;padding:10px 12px;border-left:5px solid var(--rc)}
.row:focus-visible{outline:2px solid var(--accent)}
.row .n{font-weight:700;font-size:15px}
.row .m{grid-column:1;font-size:12px;color:var(--muted)}
.row .s{grid-row:1/3;grid-column:2;align-self:center;color:var(--pop)}
.sec{font-family:var(--f-display);font-size:16px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.saved{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.saved .t{font-weight:700}
.saved .d{font-size:12px;color:var(--muted)}
.saved .names{font-size:13.5px}
.saved .b{display:flex;gap:6px}
.saved .b .btn{padding:6px 12px;font-size:13px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dock .wrap{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.roll{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:14px;background:var(--pop);color:var(--pop-ink);font-family:var(--f-display);font-weight:700;font-size:19px;box-shadow:0 3px 0 color-mix(in srgb,var(--pop) 60%,#000)}
.roll:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--pop) 60%,#000)}
.roll[disabled]{opacity:.75}
.roll svg{width:24px;height:24px}
.roll[hidden]{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 6px;font-size:11px;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(10,20,16,.45);opacity:0;transition:opacity .2s}
.sheet .panel2{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .22s ease-out;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open .bg{opacity:1}
.sheet.open .panel2{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h2{font-family:var(--f-display);font-size:18px;margin:0;flex:1;text-wrap:balance}
.sheet .sb{overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.field{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.field>label,.field>.lab{font-weight:700;font-size:14px}
.field .hint{font-size:12px;color:var(--muted)}
.field input[type="text"],.field input[type="number"]{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);width:100%}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;background:var(--surface-2)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.shop li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line)}
.shop input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.shop .nm2{font-weight:700}
.shop .am{color:var(--muted);font-size:13px}
.shop .fr{display:block;font-size:11.5px;color:var(--muted)}
.shop li.done .nm2{text-decoration:line-through;color:var(--muted)}
.copybox{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);font:inherit;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center;border-radius:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill[data-s="synced"] i{background:var(--ok)}
.pill[data-s="loading"] i{background:var(--pop)}
.pill[data-s="offline"] i,.pill[data-s="error"] i{background:var(--bad)}
.fz{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12.5px;margin-top:3px;line-height:1.5}
.fz .use{color:var(--accent)}
.fz .buy{color:var(--warn);font-weight:700}
.fz .ok{color:var(--ok);font-weight:700}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.fzline{font-size:13.5px}
.fzadd{display:flex;gap:8px;margin:8px 0 6px}
.fzadd input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.fzin{display:flex;flex-wrap:wrap;gap:6px}
.fzc{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;overflow:hidden}
.fzc button{border:0;background:none;padding:6px 2px 6px 12px;font-size:14.5px;display:inline-flex;align-items:center;gap:4px}
.fzc button.x{padding:6px 11px 6px 8px;color:var(--muted);font-size:17px;line-height:1}
.fzc.urg{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.fzc .u{font-size:10.5px;font-weight:700;color:#fff;background:var(--warn);border-radius:6px;padding:1px 5px}
.fzc.custom button:first-child{color:var(--muted)}
.fzgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fzgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:14px}
.fzgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.fzstat{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:12px 0 0;box-shadow:var(--shadow)}
.fzstat b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
details.pan{background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:16px}
details.pan summary{font-weight:700;cursor:pointer}
.wide{width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const CATN={S:'主食',P:'丼・麺',M:'主菜',D:'副菜',J:'汁物'};
const GEN={w:'和食',y:'洋食',c:'中華',k:'韓国・エスニック'};
const GEN_CHIP={w:'和',y:'洋',c:'中',k:'韓・エスニック'};
const MAINGRP={meat:['豚','鶏','牛','挽'],fish:['魚'],egg:['卵'],soy:['豆']};
const MAINGRP_N={meat:'肉',fish:'魚介',egg:'卵',soy:'豆腐・大豆'};
const VEG=new Set(['野菜','きのこ','海藻','米','いも']);
const HEALTHY={M:350,P:600,D:120,J:100};
const FZCATS=['肉','魚介','卵・乳・大豆','野菜','きのこ','乾物・海藻','缶詰・加工品','麺・皮'];
const KEY='random-gohan-v1';
const ICON={
  lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  unlock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg>',
  reroll:'<svg class="i" viewBox="0 0 24 24"><path d="M19.5 12.5a7.5 7.5 0 1 1-2.2-5.8"/><path d="M19.5 4v4.5H15"/></svg>',
  star:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.2 5.8.9-4.2 4.1 1 5.7L12 16.8l-5.2 2.7 1-5.7-4.2-4.1 5.8-.9z"/></svg>',
  starF:'<svg class="i" viewBox="0 0 24 24" style="fill:currentColor"><path d="M12 3.6l2.6 5.2 5.8.9-4.2 4.1 1 5.7L12 16.8l-5.2 2.7 1-5.7-4.2-4.1 5.8-.9z"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg>',
  cart:'<svg class="i" viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 10.5h10.2L20 7H6.3"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
  save:'<svg class="i" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg>'
};
const DEF={mode:'set',sides:1,soup:true,okN:3,okType:'mix',genres:[],quick:false,healthy:false,mains:[],servings:2,kcalT:800,saltT:2.5,exclude:'',rice:{white:true,brown:true,grain:true,mixed:true},don:false,avoid:true,harmony:true,favBoost:true,fav:[],sets:[],hist:[],recent:[],shopDone:{},cur:{set:null,okazu:null,week:null,fridge:null},fridge:[],urgent:[],pantry:{},fzForm:'set',fzBuy:0,subst:true,ts:0,synced:false,owner:null};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=load(), DB=[], BY={}, tab='gacha', opened=new Set(), rolling=false, sheetDish=null, sheetKind=null;
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&typeof j==='object'){const s=Object.assign(clone(DEF),j);s.rice=Object.assign({},DEF.rice,j.rice||{});s.cur=Object.assign({},DEF.cur,j.cur||{});return s;}}catch(e){}return clone(DEF);}
const SYNC_KEYS=['mode','sides','soup','okN','okType','genres','quick','healthy','mains','servings','kcalT','saltT','exclude','rice','don','avoid','harmony','favBoost','fav','sets','hist','recent','shopDone','fridge','urgent','pantry','fzForm','fzBuy','subst'];
let booting=true, lastSync='';
function syncPart(){const o={};SYNC_KEYS.forEach(k=>o[k]=S[k]);return o;}
function save(){
  const part=JSON.stringify(syncPart());
  if(!booting&&part!==lastSync){lastSync=part;S.ts=Date.now();scheduleCloud();}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
/* ---------- クラウド保存（あなた専用の保存場所） ---------- */
const cloud={st:'local',ref:null,ready:false,timer:null,busy:false,again:false};
const SYNC_TXT={local:'端末に保存',loading:'同期中',synced:'同期済み',offline:'オフライン',error:'保存エラー',readonly:'端末のみ'};
const SYNC_INFO={local:'この端末のブラウザに保存しています。設定の「データをコピー」で控えを取れます。',loading:'保存場所に接続しています。',synced:'あなた専用の保存場所に保存しています。同じアカウントなら別の端末でも続きから使えます。',offline:'保存場所につながりません。この端末には保存しています。',error:'保存できませんでした。この端末には保存しています。',readonly:'閲覧のみの権限のため、この端末にだけ保存しています。'};
function setSync(st){cloud.st=st;const p=$('#syncPill');if(!p)return;p.dataset.s=st;p.querySelector('span').textContent=(st==='local'&&window.__login)?'ログインして同期':SYNC_TXT[st];}
window.__initCloud=()=>initCloud();window.__setSync=setSync;
function scheduleCloud(){if(!cloud.ready||!cloud.ref)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>writeCloud(),1200);}
async function writeCloud(retry){
  if(!cloud.ref||!cloud.ready)return;
  if(cloud.busy){cloud.again=true;return;}
  cloud.busy=true;
  try{await cloud.ref.set({v:1,ts:S.ts,s:syncPart()});S.synced=true;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}setSync('synced');}
  catch(e){
    const c=e&&e.code;
    if(c==='unavailable'&&!retry){cloud.busy=false;setTimeout(()=>writeCloud(true),800+Math.random()*1200);return;}
    if(c==='invalid_argument'||c==='transform_error'){cloud.ready=false;setSync('readonly');}
    else if(c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){cloud.ready=false;setSync('local');}
    else if(c==='quota_exceeded'){setSync('error');toast('保存容量がいっぱいです。履歴を消すと空きます');}
    else setSync('offline');
  }
  cloud.busy=false;
  if(cloud.again){cloud.again=false;writeCloud();}
}
async function initCloud(tries){
  if(cloud.ready)return;
  const C=window.claude;
  if(!C||typeof C.use!=='function'){if((tries||0)<2)setTimeout(()=>initCloud((tries||0)+1),1500);else setSync('local');return;}
  setSync('loading');
  let db=null,uid=null;
  try{const r=await Promise.all([C.use('db'),C.use('user')]);db=r[0];if(r[1])uid=await r[1].id();}catch(e){}
  if(!db||!uid){setSync('local');return;}
  try{cloud.ref=db.doc('data/users/'+uid+'/state');}catch(e){setSync('local');return;}
  const to=setTimeout(()=>{if(cloud.st==='loading')setSync('offline');},10000);
  try{
    const snap=await cloud.ref.get();clearTimeout(to);
    cloud.ready=true;
    const d=snap.exists?snap.data():null;
    if(d&&d.s&&!(S.synced&&S.owner===uid&&S.ts>(d.ts||0))){S.owner=uid;applyCloud(d);setSync('synced');}
    else{
      if(!d&&S.owner&&S.owner!==uid){S=clone(DEF);opened.clear();booting=true;ensureCurrent();save();lastSync=JSON.stringify(syncPart());booting=false;rerenderAll();}
      S.owner=uid;S.ts=S.ts||Date.now();await writeCloud();
    }
  }catch(e){clearTimeout(to);setSync(e&&e.code==='revoked'?'local':'offline');}
}
function applyCloud(d){
  const c=clone(d.s);SYNC_KEYS.forEach(k=>{if(!(k in c))return;const dv=DEF[k],v=c[k];if(Array.isArray(dv)?Array.isArray(v):(v!==null&&typeof v===typeof dv))S[k]=v;});
  S.rice=Object.assign({},DEF.rice,S.rice||{});S.pantry=S.pantry||{};S.fridge=S.fridge||[];S.urgent=S.urgent||[];
  S.fav=(S.fav||[]).filter(id=>BY[id]);S.ts=d.ts||0;S.synced=true;
  booting=true;ensureCurrent();save();lastSync=JSON.stringify(syncPart());booting=false;
  rerenderAll();
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=v=>Math.round(v*10)/10;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800);}
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 分量のスケーリング ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function fmtQ(v){
  if(v>=10)return String(Math.round(v));
  if(Math.abs(v-Math.round(v))<0.02)return String(Math.round(v));
  for(const den of [2,3,4,6,8]){const n=Math.round(v*den);if(n>0&&Math.abs(v*den-n)<0.04){const w=Math.floor(n/den),rem=n%den;if(!rem)return String(w);const g=gcd(rem,den),fr=(rem/g)+'/'+(den/g);return w?w+'と'+fr:fr;}}
  return String(r1(v));
}
function toNum(t){let m=t.match(/^(\d+)と(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];m=t.match(/^(\d+)\/(\d+)$/);if(m)return m[1]/m[2];return +t;}
function scaleAmt(a,f){if(f===1)return a;return a.replace(/\d+と\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?/g,m=>fmtQ(toNum(m)*f));}

/* ---------- データ ---------- */
function parseDB(rows){
  DB=rows.map(r=>({cat:r[0],id:r[1],name:r[1],g:r[2],tag:r[3],min:r[4],kcal:r[5],p:r[6],f:r[7],c:r[8],salt:r[9],ings:r[10].split('|').map(x=>{const i=x.indexOf(':');return [x.slice(0,i),x.slice(i+1)];}),steps:r[11].split('|')}));
  BY={};DB.forEach(d=>{BY[d.id]=d;d.need=[...new Set(d.ings.flatMap(([n])=>FZ.map[n]||[]))];});
}
let FZ={items:[],byKey:{},staples:[],stapleDef:{},stapleSet:new Set(),map:{}};
function parseFZ(j){
  FZ.items=j.items.map(([k,cat,grp,syn])=>({k,cat,grp,syn}));FZ.byKey={};FZ.items.forEach(i=>FZ.byKey[i.k]=i);
  FZ.staples=j.staples.map(([k,d])=>({k,d:!!d}));FZ.stapleDef={};FZ.staples.forEach(x=>FZ.stapleDef[x.k]=x.d);
  FZ.stapleSet=new Set(FZ.staples.map(x=>x.k));FZ.map=j.map;
}
function pantryOn(k){return k in S.pantry?!!S.pantry[k]:!!FZ.stapleDef[k];}
let fitCache=new Map(),fitSig='',fzGrp=new Map();
function fit(d){
  const sig=S.fridge.join('|')+'#'+JSON.stringify(S.pantry)+'#'+S.subst;
  if(sig!==fitSig){fitSig=sig;fitCache.clear();fzGrp=new Map();S.fridge.forEach(k=>{const it=FZ.byKey[k];if(it&&!fzGrp.has(it.grp))fzGrp.set(it.grp,k);});}
  let r=fitCache.get(d.id);if(r)return r;
  const fs=new Set(S.fridge),use=[],label=[],miss=[];
  for(const k of d.need){
    if(FZ.stapleSet.has(k)){if(!(pantryOn(k)||(k==='塩こしょう'&&pantryOn('塩')&&pantryOn('こしょう'))))miss.push(k);continue;}
    if(fs.has(k)){use.push(k);label.push(k);continue;}
    const it=FZ.byKey[k],alt=S.subst&&it&&fzGrp.get(it.grp);
    if(alt){use.push(alt);label.push(alt+'（'+k+'の代わり）');}else miss.push(k);
  }
  r={use:[...new Set(use)],label,miss};fitCache.set(d.id,r);return r;
}
function fzLine(d){
  const f=fit(d);let h='';
  if(f.label.length)h+=`<span class="use">冷蔵庫：${f.label.map(l=>esc(l)+(S.urgent.includes(l)?'（早め）':'')).join('・')}</span>`;
  h+=f.miss.length?`<span class="buy">買い足し：${f.miss.map(esc).join('・')}</span>`:`<span class="ok">買い足しなし</span>`;
  return `<span class="fz">${h}</span>`;
}
function fzMissAll(ds){return [...new Set(ds.flatMap(d=>fit(d).miss))];}
function riceType(d){if(d.name==='白ごはん')return'white';if(d.name.startsWith('玄米'))return'brown';if(d.name==='雑穀ごはん'||d.name==='麦ごはん')return'grain';return'mixed';}
function exclWords(){return S.exclude.split(/[,、，\s]+/).map(s=>s.trim()).filter(Boolean);}
function grpOf(d){for(const k in MAINGRP)if(MAINGRP[k].includes(d.tag))return k;return null;}
function basePool(role,o){
  o=o||{};const words=exclWords();
  const cats=role==='S'?(S.don?['S','P']:['S']):[role];
  return DB.filter(d=>{
    if(!cats.includes(d.cat))return false;
    if(words.length&&words.some(w=>d.name.includes(w)||d.ings.some(x=>x[0].includes(w))))return false;
    if(d.cat==='S')return !!S.rice[riceType(d)];
    if(!o.noGenre&&S.genres.length&&!S.genres.includes(d.g))return false;
    if(!o.loose&&S.quick&&d.min>15)return false;
    if(!o.loose&&S.healthy&&d.kcal>HEALTHY[d.cat])return false;
    if(!o.loose&&(d.cat==='M'||d.cat==='P')&&S.mains.length&&!S.mains.some(k=>MAINGRP[k].includes(d.tag)))return false;
    return true;
  });
}
function fzOk(d,fz){const m=fit(d).miss;let n=fz.miss.size;for(const k of m)if(!fz.miss.has(k))n++;return n<=fz.buy;}
function candPool(role,fz){
  for(const o of [{},{noGenre:true},{noGenre:true,loose:true}]){let p=basePool(role,o);if(fz)p=p.filter(d=>fzOk(d,fz));if(p.length)return p;}
  return fz?[]:DB.filter(d=>d.cat===role);
}
function harmonyW(a,b){if(a===b)return 5;const near={c:'k',k:'c'};if(near[a]===b)return 2;if(b==='w'&&a!=='y')return 1.4;return 1;}
function weighted(arr,w){const t=w.reduce((a,b)=>a+b,0);let x=Math.random()*t;for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}return arr[arr.length-1];}
function pick(role,ctx){
  const p=candPool(role,ctx.fz);if(!p.length)return null;
  let cand=p.filter(d=>!ctx.exclude.has(d.id));if(!cand.length)cand=p;
  if(S.avoid){const rec=new Set(S.recent);const c2=cand.filter(d=>!rec.has(d.id));if(c2.length)cand=c2;}
  const w=cand.map(d=>{
    let x=1;
    if(d.cat==='S')x=riceType(d)==='mixed'?1:2.5;
    if(d.cat==='P')x=0.6;
    if(ctx.anchor&&(role==='D'||role==='J')){
      if(S.harmony)x*=harmonyW(ctx.anchor.g,d.g);
      if(d.tag===ctx.anchor.tag&&!VEG.has(d.tag))x*=0.12;
    }
    if(!VEG.has(d.tag)&&ctx.tags.has(d.tag))x*=0.3;

const ORDER='SMDJ';
function rollSlots(slots,onlyIdx,extra){
  extra=extra||{};
  const ctx={exclude:new Set(extra.exclude||[]),tags:new Set(),anchor:null,prevGrp:extra.prevGrp||null,fz:extra.fz?{buy:S.fzBuy,miss:new Set()}:null};
  const willRoll=i=>onlyIdx!=null?i===onlyIdx:!slots[i].lock;
  slots.forEach((s,i)=>{if(s.id&&!willRoll(i)&&BY[s.id]){ctx.exclude.add(s.id);if(!VEG.has(BY[s.id].tag)&&s.r!=='S')ctx.tags.add(BY[s.id].tag);if(ctx.fz)fit(BY[s.id]).miss.forEach(k=>ctx.fz.miss.add(k));}});
  const order=slots.map((s,i)=>i).sort((a,b)=>ORDER.indexOf(slots[a].r)-ORDER.indexOf(slots[b].r));
  const changed=[];
  for(const i of order){
    const s=slots[i];
    if(s.r==='M'){const st=slots.find(x=>x.r==='S');const sd=st&&BY[st.id];if(sd&&sd.cat==='P'){s.skip=true;ctx.anchor=sd;continue;}s.skip=false;}
    if(willRoll(i)||!BY[s.id]){const d=pick(s.r,ctx);
      if(!d){if(s.id||!s.none)changed.push(i);s.id=null;s.none=true;continue;}
      if(d.id!==s.id||willRoll(i))changed.push(i);s.id=d.id;s.none=false;}
    const d=BY[s.id];ctx.exclude.add(d.id);if(ctx.fz)fit(d).miss.forEach(k=>ctx.fz.miss.add(k));
    if(s.r==='M'||d.cat==='P'||(!ctx.anchor&&s.r==='M'))ctx.anchor=d;
    if(s.r!=='S'&&!VEG.has(d.tag))ctx.tags.add(d.tag);

}
function setRoles(){const a=['S','M'];for(let i=0;i<S.sides;i++)a.push('D');if(S.soup)a.push('J');return a;}

const fzExtra=key=>key==='fridge'?{fz:true}:null;
function okRoles(){const n=S.okN;if(S.okType==='main')return Array(n).fill('M');if(S.okType==='side')return Array(n).fill('D');return ['M'].concat(Array(Math.max(0,n-1)).fill('D'));}

function remember(ids){S.recent=ids.concat(S.recent.filter(x=>!ids.includes(x))).slice(0,40);}
function pushHist(mode,slots){S.hist.unshift({t:Date.now(),mode,slots:slots.filter(s=>!s.skip&&s.id).map(s=>({r:s.r,id:s.id}))});S.hist=S.hist.slice(0,40);}

/* ---------- 週 ---------- */
function rollWeek(onlyDay){
  const roles=setRoles();
  let w=S.cur.week;
  if(!w||onlyDay==null){const t=new Date();w={start:t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate(),days:[]};}
  const days=w.days;
  for(let k=0;k<7;k++){
    if(onlyDay!=null&&k!==onlyDay)continue;
    const ex=[];
    days.forEach((dy,j)=>{if(j===k||!dy)return;dy.forEach(s=>{const d=BY[s.id];if(d&&(d.cat!=='S'||riceType(d)==='mixed'))ex.push(s.id);});});
    const prev=days[k-1]?days[k-1].find(s=>s.r==='M'&&!s.skip):null;
    const slots=roles.map(r=>({r,id:null,lock:false}));
    rollSlots(slots,null,{exclude:ex,prevGrp:prev&&BY[prev.id]?grpOf(BY[prev.id]):null});
    days[k]=slots;
  }
  w.days=days;S.cur.week=w;
  remember(days.flat().filter(s=>!s.skip).map(s=>s.id).filter(id=>BY[id]&&BY[id].cat!=='S'));
}
function weekDate(i){const [y,m,d]=S.cur.week.start.split('-').map(Number);const dt=new Date(y,m-1,d+i);return (dt.getMonth()+1)+'/'+dt.getDate()+'（'+'日月火水木金土'[dt.getDay()]+'）';}

/* ---------- 回す ---------- */
function doRoll(onlyIdx){
  if(rolling||!DB.length)return;
  if(S.mode==='week'){rollWeek(onlyIdx);save();renderResult();if(onlyIdx==null)toast('1週間分の献立を作りました');return;}
  if(S.mode==='fridge'&&!S.fridge.length){toast('先に冷蔵庫の中身を記録してください');switchTab('fridge');return;}
  const key=S.mode, slots=syncSlots(key);
  if(onlyIdx==null&&slots.every(s=>s.lock)){toast('全部固定中です。固定を外すと回せます');return;}
  const changed=rollSlots(slots,onlyIdx,fzExtra(key));
  changed.forEach(i=>{for(const k of [...opened])if(k.startsWith(key+':'+i+':'))opened.delete(k);});
  remember(shownDishes(slots).filter(d=>d.cat!=='S').map(d=>d.id));
  pushHist(key,slots);save();
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  if(reduceMotion()||!changed.length){renderResult();return;}
  animate(key,changed);
}

    const nmEl=card.querySelector('.nm'), finalName=nmEl.textContent, s=S.cur[key][i];

const PANTRY=/^(塩|こしょう|塩こしょう|砂糖|しょうゆ|薄口しょうゆ|みりん|酒|酢|味噌|味噌（汁用）|サラダ油|ごま油|オリーブ油|揚げ油|片栗粉|片栗粉（とろみ用）|小麦粉|だし|和風だし（顆粒）|鶏がらスープの素|コンソメ（顆粒）|ケチャップ|マヨネーズ|ウスターソース|とんかつソース|オイスターソース|豆板醤|甜麺醤|ナンプラー|コチュジャン|ポン酢|めんつゆ（3倍濃縮）|白いりごま|黒いりごま|白すりごま|白練りごま|わさび|からし|はちみつ|レモン汁|おろししょうが|おろしにんにく|ラー油|カレー粉|粒マスタード|パン粉|天ぷら粉|バター|米|玄米|ご飯|赤唐辛子|赤唐辛子（輪切り）|ナツメグ|こしょう・ナツメグ|粉チーズ|しょうゆ（たれ）|付属のたれ|紅しょうが|青のり|かつお節|刻みのり|パセリ|白ワインまたは酒|赤ワイン（あれば）|ごまドレッシング|タルタルソース|天つゆ|トムヤムペースト|押し麦|雑穀ミックス|昆布)$/;

const UNIT=/^(\d+と\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(g|ml|個|本|枚|束|パック|袋|尾|切れ|かけ|丁|玉|缶|合|株|cm|膳分|皿分)$/;
function shopItems(){
  const f=S.servings/2, map=new Map(), fzm=S.mode==='fridge';
  for(const d of currentDishes()){
    const miss=fzm?new Set(fit(d).miss):null;
    for(const [n,a] of d.ings){
      if(SKIP.test(n))continue;
      let name=n;
      if(fzm){const ks=(FZ.map[n]||[]).filter(k=>miss.has(k));if(!ks.length)continue;name=ks[0];}
      if(!map.has(name))map.set(name,{n:name,amts:[],from:[],pantry:fzm?FZ.stapleSet.has(name):(PANTRY.test(n)||(n.includes('・')&&/^(小麦粉|しょうゆ|おろし|こしょう)/.test(n)))});
      const e=map.get(name);e.amts.push(scaleAmt(a,f));if(!e.from.includes(d.name))e.from.push(d.name);
    }
  }
  return [...map.values()].map(e=>{
    const sum={},other=[];
    e.amts.forEach(a=>{const m=a.match(UNIT);if(m)sum[m[2]]=(sum[m[2]]||0)+toNum(m[1]);else if(!other.includes(a))other.push(a);});
    e.amt=Object.entries(sum).map(([u,v])=>fmtQ(v)+u).concat(other).join(' ＋ ');
    return e;
  });
}

function fzSearch(q){
  q=kana(q);if(!q)return [];const sc=[];
  for(const it of FZ.items){let v=0;for(const n of [it.k].concat(it.syn).map(kana)){if(n===q)v=Math.max(v,4);else if(n.startsWith(q))v=Math.max(v,3);else if(n.includes(q))v=Math.max(v,2);else if(n.length>=2&&q.includes(n))v=Math.max(v,1);}if(v)sc.push([v,it]);}
  return sc.sort((a,b)=>b[0]-a[0]||a[1].k.length-b[1].k.length).map(x=>x[1]);
}

  h+=`<div class="fzgrid">${FZ.items.filter(i=>i.cat===fzCat).map(i=>`<button data-act="fztog" data-v="${esc(i.k)}" aria-pressed="${S.fridge.includes(i.k)}">${esc(i.k)}</button>`).join('')}</div>`;
  const onN=FZ.staples.filter(x=>pantryOn(x.k)).length;
  h+=`<details class="pan"${fzPanOpen?' open':''}><summary>常備している調味料・主食（${onN}/${FZ.staples.length}）</summary><p class="note">オンのものは家にある前提で考えます。オフのものが必要な料理は「買い足し」として数えます。</p><div class="fzgrid">${FZ.staples.map(x=>`<button data-act="pantry" data-v="${esc(x.k)}" aria-pressed="${pantryOn(x.k)}">${esc(x.k)}</button>`).join('')}</div></details>`;
  h+=`<label class="sw" for="set-subst"><span>似た食材で代用する<br><span class="note">例：豚バラの代わりに豚こま、ほうれん草の代わりに小松菜</span></span><input type="checkbox" id="set-subst" data-set="subst" ${S.subst?'checked':''}></label>`;
  $('#fzBody').innerHTML=h;
}
/* ---------- 画面切り替え ---------- */
function switchTab(v){
  tab=v;
  $$('.tabs button').forEach(b=>b.dataset.v===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  ['gacha','fridge','zukan','fav','hist'].forEach(x=>$('#v-'+x).hidden=x!==v);
  $('#btnRoll').hidden=v!=='gacha';
  if(v==='gacha'){renderOpts();renderResult();}
  if(v==='zukan')renderZukan();
  if(v==='fridge'){renderFridge();renderFzSug();}
  if(v==='fav')renderFav();
  if(v==='hist')renderHist();
  window.scrollTo(0,0);
}
function rerenderAll(){if(tab==='gacha'){renderOpts();renderResult();}else if(tab==='fridge'){renderFridge();renderFzSug();}else if(tab==='zukan')renderZukan();else if(tab==='fav')renderFav();else if(tab==='hist')renderHist();}
function ensureCurrent(){
  if(S.mode==='week'){if(!S.cur.week||!S.cur.week.days||S.cur.week.days.length!==7||S.cur.week.days.some(d=>!d||d.some(s=>!BY[s.id])))rollWeek();return;}
  const slots=syncSlots(S.mode);
  if(slots.some(s=>!s.skip&&!s.none&&!BY[s.id])){rollSlots(slots,-1,fzExtra(S.mode));}
}
function useDish(id){
  const d=BY[id];if(!d)return;closeSheet();
  if(S.mode==='week')S.mode='set';
  let form=S.mode==='fridge'?S.fzForm:S.mode;
  if(form==='okazu'&&!(d.cat==='M'||d.cat==='D')){form='set';if(S.mode==='fridge')S.fzForm='set';else S.mode='set';}
  if(form==='set'){if(d.cat==='P')S.don=true;if(d.cat==='S'&&!S.rice[riceType(d)])S.rice[riceType(d)]=true;if(d.cat==='D'&&S.sides===0)S.sides=1;if(d.cat==='J')S.soup=true;}
  else{if(d.cat==='M'&&S.okType==='side')S.okType='mix';if(d.cat==='D'&&S.okType==='main')S.okType='mix';if(d.cat==='D'&&S.okN<2)S.okN=2;}
  const slots=syncSlots(S.mode);slots.forEach(s=>s.lock=false);
  const role=d.cat==='P'?'S':d.cat;const s=slots.find(x=>x.r===role);
  s.id=id;s.lock=true;s.none=false;
  switchTab('gacha');
  doRoll();
  toast(`「${d.name}」を固定して回しました`);
}

/* ---------- イベント ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case 'roll':doRoll();break;
    case 'tab':switchTab(v);break;
    case 'mode':S.mode=v;ensureCurrent();save();renderOpts();renderResult();break;
    case 'sides':S.sides=+v;syncSlots('set');ensureCurrent();if(S.mode==='week')rollWeek();save();rerenderAll();break;
    case 'soup':S.soup=v==='1';syncSlots('set');ensureCurrent();if(S.mode==='week')rollWeek();save();rerenderAll();break;
    case 'fzForm':S.fzForm=v;syncSlots('fridge');ensureCurrent();save();rerenderAll();break;
    case 'fzBuy':S.fzBuy=+v;save();renderOpts();break;
    case 'fztog':{const on=S.fridge.includes(v);on?fzRemove(v):fzAdd(v);save();renderFridge();renderFzSug();break;}
    case 'fzdel':fzRemove(v);save();renderFridge();renderFzSug();toast(`${v}を消しました`);break;
    case 'fzurg':S.urgent=S.urgent.includes(v)?S.urgent.filter(x=>x!==v):S.urgent.concat(v);save();renderFridge();break;
    case 'fzcat':fzCat=v;renderFridge();break;
    case 'fzsug':{fzAdd(v);const ws=splitWords($('#fzIn').value);ws.pop();$('#fzIn').value=ws.length?ws.join(' ')+' ':'';save();renderFridge();renderFzSug();$('#fzIn').focus();toast(`${v}を入れました`);break;}
    case 'pantry':S.pantry[v]=!pantryOn(v);save();renderFridge();break;
    case 'fzclear':if(b.dataset.armed){S.fridge=[];S.urgent=[];save();renderFridge();toast('冷蔵庫を空にしました');}else{b.dataset.armed='1';b.textContent='もう一度押すと全部消えます';setTimeout(()=>{if(document.contains(b)){delete b.dataset.armed;b.textContent='全部消す';}},3000);}break;
    case 'fzgo':S.mode='fridge';syncSlots('fridge');switchTab('gacha');doRoll();break;
    case 'cooked':openCooked();break;
    case 'cookeddel':{const ks=$$('.ckuse:checked').map(x=>x.value);ks.forEach(fzRemove);save();closeSheet();rerenderAll();toast(ks.length?`${ks.length}品を冷蔵庫から消しました`:'消すものは選ばれていません');break;}
    case 'shop2fz':{let n=0;shopItems().filter(e=>S.shopDone[e.n]).forEach(e=>{keysOf(e.n).forEach(k=>{if(FZ.stapleSet.has(k)){if(!pantryOn(k)){S.pantry[k]=true;n++;}}else if(fzAdd(k))n++;});delete S.shopDone[e.n];});save();refreshSheet();rerenderAll();toast(n?`${n}品を冷蔵庫に入れました`:'チェックした食材はもう冷蔵庫にあるか、チェックがありません');break;}
    case 'syncinfo':if(cloud.st==='local'&&window.__login){if(sheetKind==='settings'){window.__login().catch(()=>toast('ログインできませんでした。もう一度お試しください'));}else openSettings();}else toast(SYNC_INFO[cloud.st]);break;
    case 'clouddel':if(b.dataset.armed){(async()=>{try{if(cloud.ref&&cloud.ref.delete)await cloud.ref.delete();cloud.ready=false;try{localStorage.removeItem(KEY);}catch(x){}toast('クラウドのデータを削除しました');setTimeout(()=>{window.__logout?window.__logout():location.reload();},800);}catch(x){toast('削除できませんでした。通信状態を確認してもう一度お試しください');}})();}else{b.dataset.armed='1';b.textContent='もう一度押すと完全に削除します';setTimeout(()=>{if(document.contains(b)){delete b.dataset.armed;b.textContent='クラウドのデータを削除';}},3000);}break;
    case 'logout':if(window.__logout)window.__logout();break;
    case 'export':copyText(JSON.stringify({app:'random-gohan',v:1,ts:S.ts,s:syncPart()}));break;
    case 'importopen':sheetKind='import';openSheet('データを復元',`<p class="note" style="margin:0 0 8px">「データをコピー」で控えた文字を貼り付けてください。今のデータは置き換わります。</p><textarea class="copybox" id="impText" aria-label="復元するデータ"></textarea><div class="dtools"><button class="btn primary" data-act="importdo">復元する</button></div>`);break;
    case 'importdo':{let d=null;try{d=JSON.parse($('#impText').value.trim());}catch(x){}if(!d||d.app!=='random-gohan'||!d.s||typeof d.s!=='object'){toast('読み取れませんでした。コピーした文字をそのまま貼り付けてください');break;}applyCloud(d);S.ts=Date.now();save();closeSheet();toast('復元しました');break;}
    case 'okN':S.okN=+v;syncSlots('okazu');ensureCurrent();save();rerenderAll();break;
    case 'okType':S.okType=v;syncSlots('okazu');ensureCurrent();save();rerenderAll();break;
    case 'genre':S.genres=S.genres.includes(v)?S.genres.filter(x=>x!==v):S.genres.concat(v);save();renderOpts();break;
    case 'quick':S.quick=!S.quick;save();renderOpts();break;
    case 'healthy':S.healthy=!S.healthy;save();renderOpts();break;
    case 'main':S.mains=S.mains.includes(v)?S.mains.filter(x=>x!==v):S.mains.concat(v);save();renderOpts();break;
    case 'clearf':S.genres=[];S.quick=false;S.healthy=false;S.mains=[];save();renderOpts();break;
    case 'toggle':{const k=b.dataset.k;opened.has(k)?opened.delete(k):opened.add(k);renderResult();const c=$(`[data-k="${CSS.escape(k)}"]`);if(c)c.focus({preventScroll:true});break;}
    case 'openall':{const ks=openKeys(),ao=allOpen();ks.forEach(k=>ao?opened.delete(k):opened.add(k));renderResult();break;}
    case 'lock':{const s=S.cur[b.dataset.key][+b.dataset.i];s.lock=!s.lock;save();renderResult();const nb=$(`.ic[data-act="lock"][data-key="${b.dataset.key}"][data-i="${b.dataset.i}"]`);if(nb)nb.focus();toast(s.lock?'固定しました。回しても変わりません':'固定を外しました');break;}
    case 'reroll':doRoll(+b.dataset.i);break;
    case 'dayroll':doRoll(+v);toast(`${weekDate(+v)}を回し直しました`);break;
    case 'fav':{const id=b.dataset.id;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[id].concat(S.fav);save();toast(S.fav.includes(id)?'お気に入りに追加しました':'お気に入りから外しました');if(sheetKind==='dish')refreshSheet();rerenderAll();break;}
    case 'use':useDish(b.dataset.id);break;
    case 'sheet':openDish(b.dataset.id);break;
    case 'srv':S.servings=Math.min(6,Math.max(1,S.servings+(+v)));save();if(sheetKind==='dish')refreshSheet();if(tab==='gacha')renderResult();break;
    case 'close':closeSheet();break;
    case 'saveset':{const key=S.mode,slots=(S.cur[key]||[]).filter(s=>!s.skip&&BY[s.id]);if(!slots.length)break;const m=slots.find(s=>s.r==='M')||slots.find(s=>BY[s.id].cat==='P')||slots[0];S.sets.unshift({t:Date.now(),mode:key,name:key==='set'?BY[m.id].name+'の献立':'おかず'+slots.length+'品（'+BY[m.id].name+'ほか）',slots:slots.map(s=>({r:s.r,id:s.id}))});S.sets=S.sets.slice(0,60);save();toast('保存しました（お気に入りタブ）');break;}
    case 'delset':S.sets.splice(+v,1);save();renderFav();toast('削除しました');break;
    case 'load':loadEntry(clone(S[b.dataset.src][+v]));break;
    case 'clearhist':if(b.dataset.armed){S.hist=[];save();renderHist();toast('履歴を消しました');}else{b.dataset.armed='1';b.textContent='もう一度押すと消えます';setTimeout(()=>{if(document.contains(b)){delete b.dataset.armed;b.textContent='履歴を消す';}},3000);}break;
    case 'shop':openShop();break;
    case 'shopchk':{S.shopDone[v]=b.checked;if(!b.checked)delete S.shopDone[v];save();b.closest('li').classList.toggle('done',b.checked);break;}
    case 'shopreset':S.shopDone={};save();refreshSheet();break;
    case 'copyshop':copyText(shopText());break;
    case 'copy':copyText(menuText());break;
    case 'zkcat':zk.cat=v;renderZukan();break;
    case 'zkgen':zk.g=v;renderZukan();break;
    case 'reset':if(b.dataset.armed){try{localStorage.removeItem(KEY);}catch(x){}S=clone(DEF);opened.clear();closeSheet();ensureCurrent();save();switchTab('gacha');toast('初期化しました');}else{b.dataset.armed='1';b.textContent='もう一度押すと初期化します';setTimeout(()=>{if(document.contains(b)){delete b.dataset.armed;b.textContent='すべてのデータを初期化';}},3000);}break;
  }
});
$('#btnSettings').addEventListener('click',openSettings);
$('#q').addEventListener('input',renderZukan);
$('#fzIn').addEventListener('input',renderFzSug);
$('#fzForm').addEventListener('submit',e=>{
  e.preventDefault();const ws=splitWords($('#fzIn').value);if(!ws.length)return;
  const added=[],custom=[];
  ws.forEach(w=>{const r=fzSearch(w);const k=r.length?r[0].k:w.slice(0,20);if(!r.length)custom.push(k);if(fzAdd(k))added.push(k);});
  $('#fzIn').value='';save();renderFridge();renderFzSug();
  toast(added.length?`${added.join('・')}を入れました${custom.length?'（'+custom.join('・')+'はレシピにない名前です）':''}`:'もう入っています');
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.pan'))fzPanOpen=e.target.open;},true);
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-set]');if(!el)return;
  const k=el.dataset.set;
  if(k.startsWith('rice.'))S.rice[k.slice(5)]=el.checked;
  else if(k==='exclude')S.exclude=el.value;
  else if(k==='kcalT'){const n=+el.value;if(n>=300&&n<=1500)S.kcalT=Math.round(n);}
  else if(k==='saltT'){const n=+el.value;if(n>=1&&n<=6)S.saltT=r1(n);}
  else S[k]=el.checked;
  save();rerenderAll();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

/* ---------- 起動 ---------- */
Promise.all(['menus.json','fridge.json'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json();}))).then(([rows,fz])=>{
  parseFZ(fz);parseDB(rows);
  S.fav=S.fav.filter(id=>BY[id]);
  ensureCurrent();
  save();lastSync=JSON.stringify(syncPart());booting=false;
  switchTab('gacha');
  initCloud();
}).catch(err=>{$('#result').innerHTML='<p class="empty">メニューデータを読み込めませんでした。ページを再読み込みしてください。</p>';console.error(err);});
})();
</script>
<script type="module" src="fb.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
